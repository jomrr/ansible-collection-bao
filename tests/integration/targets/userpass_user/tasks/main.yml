---
- name: Reject a plain http URL before connecting
  jomrr.bao.userpass_user:
    url: http://bao.example.test:8200
    token: synthetic-test-token
    mount: users
    name: operator
    token_policies: &id001
      - operator
  register: bao_test_userpass_user_url
  ignore_errors: true

- name: Fail on an unreachable server
  jomrr.bao.userpass_user:
    url: https://127.0.0.1:1
    token: synthetic-test-token
    mount: users
    name: operator
    token_policies: *id001
  register: bao_test_userpass_user_offline
  ignore_errors: true

- name: Fail on an unreachable server in check mode
  jomrr.bao.userpass_user:
    url: https://127.0.0.1:1
    token: synthetic-test-token
    mount: users
    name: operator
    token_policies: *id001
  register: bao_test_userpass_user_check
  check_mode: true
  ignore_errors: true

- name: Verify validation and error handling
  ansible.builtin.assert:
    that:
      - bao_test_userpass_user_url is failed
      - "'https' in bao_test_userpass_user_url.msg"
      - bao_test_userpass_user_offline is failed
      - "'failed' in bao_test_userpass_user_offline.msg"
      - "'synthetic-test-token' not in bao_test_userpass_user_offline.msg"
      - "'synthetic-test-secret' not in bao_test_userpass_user_offline.msg"
      - bao_test_userpass_user_check is failed
      - bao_test_userpass_user_check is not changed
    quiet: true
