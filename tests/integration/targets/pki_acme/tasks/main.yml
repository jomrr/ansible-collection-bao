---
- name: Reject a plain http URL before connecting
  jomrr.bao.pki_acme:
    url: http://bao.example.test:8200
    token: synthetic-test-token
    mount: pki
    enabled: true
  register: bao_test_pki_acme_url
  ignore_errors: true

- name: Fail on an unreachable server
  jomrr.bao.pki_acme:
    url: https://127.0.0.1:1
    token: synthetic-test-token
    mount: pki
    enabled: true
  register: bao_test_pki_acme_offline
  ignore_errors: true

- name: Fail on an unreachable server in check mode
  jomrr.bao.pki_acme:
    url: https://127.0.0.1:1
    token: synthetic-test-token
    mount: pki
    enabled: true
  register: bao_test_pki_acme_check
  check_mode: true
  ignore_errors: true

- name: Verify validation and error handling
  ansible.builtin.assert:
    that:
      - bao_test_pki_acme_url is failed
      - "'https' in bao_test_pki_acme_url.msg"
      - bao_test_pki_acme_offline is failed
      - "'failed' in bao_test_pki_acme_offline.msg"
      - "'synthetic-test-token' not in bao_test_pki_acme_offline.msg"
      - "'synthetic-test-secret' not in bao_test_pki_acme_offline.msg"
      - bao_test_pki_acme_check is failed
      - bao_test_pki_acme_check is not changed
    quiet: true
