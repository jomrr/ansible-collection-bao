---
- name: Reject a plain http URL before connecting
  jomrr.bao.approle_secret_id:
    url: http://bao.example.test:8200
    token: synthetic-test-token
    role: app
    secret_id: synthetic-test-secret
  register: bao_test_approle_secret_id_url
  ignore_errors: true

- name: Fail on an unreachable server
  jomrr.bao.approle_secret_id:
    url: https://127.0.0.1:1
    token: synthetic-test-token
    role: app
    secret_id: synthetic-test-secret
  register: bao_test_approle_secret_id_offline
  ignore_errors: true

- name: Reject an invalid argument combination
  jomrr.bao.approle_secret_id:
    url: https://127.0.0.1:1
    token: synthetic-test-token
    role: app
    secret_id: synthetic-test-secret
    verify: true
  register: bao_test_approle_secret_id_invalid
  ignore_errors: true

- name: Fail on an unreachable server in check mode
  jomrr.bao.approle_secret_id:
    url: https://127.0.0.1:1
    token: synthetic-test-token
    role: app
    secret_id: synthetic-test-secret
  register: bao_test_approle_secret_id_check
  check_mode: true
  ignore_errors: true

- name: Verify validation and error handling
  ansible.builtin.assert:
    that:
      - bao_test_approle_secret_id_url is failed
      - "'https' in bao_test_approle_secret_id_url.msg"
      - bao_test_approle_secret_id_offline is failed
      - "'failed' in bao_test_approle_secret_id_offline.msg"
      - "'synthetic-test-token' not in bao_test_approle_secret_id_offline.msg"
      - "'synthetic-test-secret' not in bao_test_approle_secret_id_offline.msg"
      - bao_test_approle_secret_id_invalid is failed
      - "'synthetic-test-token' not in bao_test_approle_secret_id_invalid.msg"
      - "'synthetic-test-secret' not in bao_test_approle_secret_id_invalid.msg"
      - bao_test_approle_secret_id_check is failed
      - bao_test_approle_secret_id_check is not changed
    quiet: true
