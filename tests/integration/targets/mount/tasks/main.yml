---
- name: Reject a plain http URL before connecting
  jomrr.bao.mount:
    url: http://bao.example.test:8200
    token: synthetic-test-token
    path: kv
    type: kv
  register: bao_test_mount_url
  ignore_errors: true

- name: Fail on an unreachable server
  jomrr.bao.mount:
    url: https://127.0.0.1:1
    token: synthetic-test-token
    path: kv
    type: kv
  register: bao_test_mount_offline
  ignore_errors: true

- name: Reject an invalid argument combination
  jomrr.bao.mount:
    url: https://127.0.0.1:1
    token: synthetic-test-token
    path: kv
  register: bao_test_mount_invalid
  ignore_errors: true

- name: Fail on an unreachable server in check mode
  jomrr.bao.mount:
    url: https://127.0.0.1:1
    token: synthetic-test-token
    path: kv
    type: kv
  register: bao_test_mount_check
  check_mode: true
  ignore_errors: true

- name: Verify validation and error handling
  ansible.builtin.assert:
    that:
      - bao_test_mount_url is failed
      - "'https' in bao_test_mount_url.msg"
      - bao_test_mount_offline is failed
      - "'failed' in bao_test_mount_offline.msg"
      - "'synthetic-test-token' not in bao_test_mount_offline.msg"
      - "'synthetic-test-secret' not in bao_test_mount_offline.msg"
      - bao_test_mount_invalid is failed
      - "'synthetic-test-token' not in bao_test_mount_invalid.msg"
      - "'synthetic-test-secret' not in bao_test_mount_invalid.msg"
      - bao_test_mount_check is failed
      - bao_test_mount_check is not changed
    quiet: true
