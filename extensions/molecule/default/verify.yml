---
- name: Verify the converged OpenBao configuration
  hosts: all
  gather_facts: false
  module_defaults:
    group/jomrr.bao.all:
      url: "{{ bao_test_url }}"
      ca_file: "{{ bao_test_ca_file }}"
      token: "{{ bao_test_root_token }}"
    ansible.builtin.uri:
      ca_path: "{{ bao_test_ca_file }}"
      headers:
        X-Vault-Token: "{{ bao_test_root_token }}"
      body_format: json
      use_netrc: false
      follow_redirects: none
  vars:
    bao_url: "{{ bao_test_url }}"
    bao_ca_file: "{{ bao_test_ca_file }}"
    bao_token: "{{ bao_test_root_token }}"
  tasks:
    - name: Read the health of the running server
      jomrr.bao.health_info:
        url: "{{ bao_test_url }}"
        ca_file: "{{ bao_test_ca_file }}"
      register: bao_test_running

    - name: Verify the running state
      ansible.builtin.assert:
        that:
          - bao_test_running is not changed
          - bao_test_running.initialized
          - not bao_test_running.sealed
          - bao_test_running.ready
          - bao_test_running.version.split('.')[:2] | join('.') == bao_test_version
        quiet: true

    - name: Read the repaired resources
      ansible.builtin.uri:
        url: "{{ bao_test_url }}/v1/{{ item }}"
      loop:
        - sys/policies/acl/reader
        - auth/approle/role/application
        - auth/approle/role/application/role-id
        - kv/data/app/managed
        - pki-int/roles/web-server
        - pki-int/config/issuers
        - pki-int/issuer/intermediate
        - ssh/roles/hosts
        - ssh/config/ca
        - sys/mounts
      register: bao_test_read
      no_log: true

    - name: Verify drift repair and preservation
      ansible.builtin.assert:
        that:
          - bao_test_read.results[0].json.data.policy is search('"read"')
          - bao_test_read.results[1].json.data.token_ttl == 900
          - bao_test_read.results[1].json.data.token_policies == ['application']
          - bao_test_read.results[2].json.data.role_id == 'application'
          - bao_test_read.results[3].json.data.data.username == 'application'
          - "bao_test_read.results[3].json.data.data.nested == {'desired': true}"
          - bao_test_read.results[3].json.data.data.additional == 'preserved'
          - bao_test_read.results[3].json.data.data.password | length == 40
          - bao_test_read.results[3].json.data.data.password == lookup('ansible.builtin.file', bao_test_files ~ '-generated-password')
          - bao_test_read.results[4].json.data.ttl == 2592000
          - bao_test_read.results[4].json.data.allow_subdomains
          - bao_test_read.results[4].json.data.ext_key_usage_oids == []
          - bao_test_read.results[5].json.data.default == bao_test_read.results[6].json.data.issuer_id
          - bao_test_read.results[6].json.data.issuing_certificates | length == 1
          - bao_test_read.results[7].json.data.allowed_domains == 'example.test'
          - bao_test_read.results[7].json.data.ttl == 2592000
          - bao_test_read.results[8].json.data.public_key is search('ssh-ed25519')
          - bao_test_read.results[9].json.data['kv/'].description == 'Application secrets'
          - "'unrelated/' in bao_test_read.results[9].json.data"
        quiet: true

    - name: Verify the lookup with the session variables
      ansible.builtin.assert:
        that:
          - lookup('jomrr.bao.kv2', 'app/managed', mount='kv', key='username') == 'application'
          - lookup('jomrr.bao.kv2', 'app/managed', mount='kv') | dict2items | map(attribute='key') | sort == ['additional', 'nested', 'password', 'username']
          - query('jomrr.bao.kv2', 'app/managed', 'app/managed', mount='kv', key='username') == ['application', 'application']
        quiet: true

    - name: Read a missing key through the lookup
      ansible.builtin.debug:
        msg: "{{ lookup('jomrr.bao.kv2', 'app/managed', mount='kv', key='missing') }}"
      register: bao_test_lookup_missing
      ignore_errors: true

    - name: Verify the lookup error names mount and path only
      ansible.builtin.assert:
        that:
          - bao_test_lookup_missing is failed
          - "'kv/app/managed' in bao_test_lookup_missing.msg"
          - "'application' not in bao_test_lookup_missing.msg"
        quiet: true

    - name: Repeat converged resources and actions
      block:
        - name: Repeat the administration AppRole with empty network lists
          jomrr.bao.approle:
            name: molecule-admin
            secret_id_bound_cidrs: []
            token_bound_cidrs: []
          register: bao_test_empty_networks

        - name: Repeat the intermediate issuer with an empty manual chain
          jomrr.bao.pki_issuer:
            mount: pki-int
            name: intermediate
            manual_chain: []
          register: bao_test_empty_chain

        - name: Repeat the root authority
          jomrr.bao.pki_ca:
            mount: pki-root
            issuer_name: root
            type: root
            common_name: Molecule Root CA
          register: bao_test_root_again

        - name: Repeat the SSH signing key
          jomrr.bao.ssh_ca:
            mount: ssh
          register: bao_test_ssh_again

        - name: Verify the idempotent resources and actions
          ansible.builtin.assert:
            that:
              - bao_test_empty_networks is not changed
              - bao_test_empty_chain is not changed
              - bao_test_root_again is not changed
              - bao_test_root_again.certificate is search('BEGIN CERTIFICATE')
              - bao_test_ssh_again is not changed
              - bao_test_ssh_again.public_key == bao_test_read.results[8].json.data.public_key
            quiet: true

    - name: Read AppRoles and roll back a binding change
      block:
        - name: Read the restricted AppRole
          jomrr.bao.approle_info:
            name: restricted
          register: bao_test_role_before

        - name: Read a missing AppRole
          jomrr.bao.approle_info:
            name: missing
          register: bao_test_role_missing

        - name: Change the bindings of the restricted AppRole
          jomrr.bao.approle:
            name: restricted
            secret_id_bound_cidrs: [192.0.2.0/24]
            token_bound_cidrs: [192.0.2.0/24]
          register: bao_test_role_changed

        - name: Restore the bindings from the earlier read
          jomrr.bao.approle:
            name: restricted
            secret_id_bound_cidrs: "{{ bao_test_role_before.secret_id_bound_cidrs }}"
            token_bound_cidrs: "{{ bao_test_role_before.token_bound_cidrs }}"
          register: bao_test_role_restored

        - name: Read the restored AppRole
          jomrr.bao.approle_info:
            name: restricted
          register: bao_test_role_after

        - name: Log in with a new verification token
          jomrr.bao.login:
            url: "{{ bao_test_url }}"
            ca_file: "{{ bao_test_ca_file }}"
            role_id: molecule-admin
            secret_id: molecule-admin-secret-id-not-for-production
          register: bao_test_probe
          no_log: true

        - name: Read the AppRole with the verification token
          jomrr.bao.approle_info:
            token: "{{ bao_test_probe.token }}"
            name: molecule-admin
          register: bao_test_role_probe

        - name: Close the verification session
          jomrr.bao.logout:
            token: "{{ bao_test_probe.token }}"

        - name: Verify the reads and the rollback
          ansible.builtin.assert:
            that:
              - bao_test_role_before is not changed
              - bao_test_role_before.exists
              - "'203.0.113.7/32' in bao_test_role_before.secret_id_bound_cidrs"
              - "'203.0.113.7' in bao_test_role_before.token_bound_cidrs"
              - bao_test_role_before.role.token_policies == ['reader']
              - not bao_test_role_missing.exists
              - bao_test_role_missing.secret_id_bound_cidrs == []
              - bao_test_role_changed is changed
              - bao_test_role_restored is changed
              - bao_test_role_after.secret_id_bound_cidrs | sort == bao_test_role_before.secret_id_bound_cidrs | sort
              - bao_test_role_after.token_bound_cidrs | sort == bao_test_role_before.token_bound_cidrs | sort
              - bao_test_role_probe.exists
            quiet: true

    - name: Revoke a token that cannot call the API itself
      block:
        - name: Create an AppRole bound to a foreign network
          jomrr.bao.approle:
            name: bound
            role_id: bound
            token_policies: [reader]
            token_bound_cidrs: [192.0.2.0/24]

        - name: Register its Secret ID
          jomrr.bao.approle_secret_id:
            role: bound
            secret_id: molecule-bound-secret-id-not-for-production

        - name: Log in from outside the bound network
          jomrr.bao.login:
            url: "{{ bao_test_url }}"
            ca_file: "{{ bao_test_ca_file }}"
            role_id: bound
            secret_id: molecule-bound-secret-id-not-for-production
          register: bao_test_bound
          no_log: true

        - name: Read with the bound token
          jomrr.bao.approle_info:
            token: "{{ bao_test_bound.token }}"
            name: bound
          register: bao_test_bound_read
          ignore_errors: true

        - name: Log out with the bound token
          jomrr.bao.logout:
            token: "{{ bao_test_bound.token }}"
          register: bao_test_bound_logout
          ignore_errors: true

        - name: Revoke the bound token by its accessor twice
          jomrr.bao.token_revoke:
            accessor: "{{ bao_test_bound.accessor }}"
          register: bao_test_bound_revoke
          loop: [first, repeated]

        - name: Remove the bound AppRole
          jomrr.bao.approle:
            name: bound
            state: absent

        - name: Verify the revocation by accessor
          ansible.builtin.assert:
            that:
              - bao_test_bound_read is failed
              - "'HTTP 403' in bao_test_bound_read.msg"
              - bao_test_bound_logout is failed
              - "'HTTP 403' in bao_test_bound_logout.msg"
              - bao_test_bound_revoke.results[0] is changed
              - bao_test_bound_revoke.results[1] is not changed
              - "'No token found' in bao_test_bound_revoke.results[1].msg"
            quiet: true

    - name: Rotate the CRL
      jomrr.bao.pki_crl_rotate:
        mount: pki-int
      register: bao_test_crl

    - name: Create an ACME account binding
      jomrr.bao.pki_acme_eab:
        mount: pki-int
        role: web-server
      register: bao_test_eab
      no_log: true

    - name: Verify the actions
      ansible.builtin.assert:
        that:
          - bao_test_crl is changed
          - bao_test_crl.success
          - bao_test_eab is changed
          - bao_test_eab.id | length > 0
          - bao_test_eab.key | length > 0
        quiet: true

    - name: Create a disposable secret and soft delete its version
      block:
        - name: Create the disposable secret
          jomrr.bao.kv2_secret:
            mount: kv
            path: app/disposable
            data: {value: original}

        - name: Soft delete the current version
          ansible.builtin.uri:
            url: "{{ bao_test_url }}/v1/kv/data/app/disposable"
            method: DELETE
            status_code: 204

        - name: Attempt to regenerate the deleted secret
          jomrr.bao.kv2_secret:
            mount: kv
            path: app/disposable
            generate: {value: {}}
          register: bao_test_tombstone
          ignore_errors: true

        - name: Remove the disposable secret twice
          jomrr.bao.kv2_secret:
            mount: kv
            path: app/disposable
            state: absent
          register: bao_test_removal
          loop: [first, repeated]

        - name: Verify the tombstone guard and removal
          ansible.builtin.assert:
            that:
              - bao_test_tombstone is failed
              - "'no readable current version' in bao_test_tombstone.msg"
              - bao_test_removal.results[0] is changed
              - bao_test_removal.results[1] is not changed
            quiet: true

    - name: Verify check mode did not create resources
      ansible.builtin.uri:
        url: "{{ bao_test_url }}/v1/{{ item }}"
        status_code: 404
      loop:
        - kv/metadata/app/check-only
        - auth/users/users/check-only

    - name: Reject an audit device on a server without API audit creation
      block:
        - name: Enable an audit device
          jomrr.bao.audit_device:
            path: file
            type: file
            options:
              file_path: discard
          register: bao_test_audit
          ignore_errors: true

        - name: Verify the rejected audit device
          ansible.builtin.assert:
            that:
              - bao_test_audit is failed
              - "'cannot enable audit device via API' in bao_test_audit.msg"
            quiet: true

    - name: Reject a snapshot of a server without raft storage
      block:
        - name: Save a snapshot without raft storage
          jomrr.bao.raft_snapshot:
            path: "{{ bao_test_files }}-raft.snap"
          register: bao_test_snapshot
          ignore_errors: true

        - name: Find files left by the rejected snapshot
          ansible.builtin.find:
            paths: "{{ bao_test_files | dirname }}"
            patterns: ["{{ inventory_hostname }}-raft.snap", .bao-snapshot-*]
            hidden: true
          register: bao_test_snapshot_files

        - name: Verify the rejected snapshot
          ansible.builtin.assert:
            that:
              - bao_test_snapshot is failed
              - "'HTTP 404' in bao_test_snapshot.msg"
              - bao_test_snapshot_files.matched == 0
            quiet: true

    # Sealing ends the scenario; it must stay the last step.
    - name: Seal the server and read its health
      block:
        - name: Seal the server
          ansible.builtin.uri:
            url: "{{ bao_test_url }}/v1/sys/seal"
            method: PUT
            status_code: 204

        - name: Read the health of the sealed server
          jomrr.bao.health_info:
            url: "{{ bao_test_url }}"
            ca_file: "{{ bao_test_ca_file }}"
          register: bao_test_sealed

        - name: Verify the sealed state
          ansible.builtin.assert:
            that:
              - bao_test_sealed is not changed
              - bao_test_sealed.initialized
              - bao_test_sealed.sealed
              - not bao_test_sealed.ready
            quiet: true
