---
- name: Prepare the OpenBao dev server fixtures
  hosts: all
  gather_facts: false
  tasks:
    - name: Read the dev CA certificate from the container
      containers.podman.podman_container_exec:
        name: "{{ bao_test_container }}"
        argv: [cat, /tmp/vault-ca.pem]
      register: bao_test_ca
      until: bao_test_ca is succeeded and 'BEGIN CERTIFICATE' in bao_test_ca.stdout
      retries: 15
      delay: 2
      changed_when: false

    - name: Store the CA certificate for the controller
      ansible.builtin.copy:
        content: "{{ bao_test_ca.stdout }}\n"
        dest: "{{ bao_test_ca_file }}"
        mode: "0600"

    - name: Wait for an initialized and unsealed server
      jomrr.bao.health_info:
        url: "{{ bao_test_url }}"
        ca_file: "{{ bao_test_ca_file }}"
      register: bao_test_health
      until: bao_test_health is succeeded and bao_test_health.ready
      retries: 20
      delay: 2
