# Generated by leg: collection Molecule configuration
---
driver:
  name: podman
scenario:
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - check
    - side_effect
    - converge
    - idempotence
    - verify
    - cleanup
    - destroy
provisioner:
  inventory:
    host_vars:
      openbao:
        ansible_connection: local
        ansible_python_interpreter: '{{ ansible_playbook_python }}'
    group_vars:
      all:
        bao_test_container: openbao
        bao_test_url: https://127.0.0.1:18200
        bao_test_ca_file: '{{ lookup(''ansible.builtin.env'', ''MOLECULE_EPHEMERAL_DIRECTORY'')
          }}/openbao-ca.pem'
        bao_test_root_token: molecule-root-token-not-for-production
platforms:
  - name: openbao
    image: quay.io/openbao/openbao:latest
    pre_build_image: true
    command: server -dev -dev-tls -dev-tls-cert-dir=/tmp -dev-listen-address=0.0.0.0:8200
      -dev-root-token-id=molecule-root-token-not-for-production
    published_ports:
      - 127.0.0.1:18200:8200
