---
- name: Reject a plain http URL before connecting
  jomrr.bao.health_info:
    url: http://bao.example.test:8200
  register: bao_test_health_info_url
  ignore_errors: true

- name: Fail on an unreachable server
  jomrr.bao.health_info:
    url: https://127.0.0.1:1
  register: bao_test_health_info_offline
  ignore_errors: true

- name: Fail on an unreachable server in check mode
  jomrr.bao.health_info:
    url: https://127.0.0.1:1
  register: bao_test_health_info_check
  check_mode: true
  ignore_errors: true

- name: Verify validation and error handling
  ansible.builtin.assert:
    that:
      - bao_test_health_info_url is failed
      - "'https' in bao_test_health_info_url.msg"
      - bao_test_health_info_offline is failed
      - "'sys/health failed' in bao_test_health_info_offline.msg"
      - bao_test_health_info_offline is not changed
      - bao_test_health_info_check is failed
      - bao_test_health_info_check is not changed
    quiet: true
