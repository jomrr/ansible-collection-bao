---
- name: Reject a plain http URL before connecting
  jomrr.bao.pki_ca:
    url: http://bao.example.test:8200
    token: synthetic-test-token
    mount: pki
    issuer_name: root
    type: root
    common_name: Root
  register: bao_test_pki_ca_url
  ignore_errors: true

- name: Fail on an unreachable server
  jomrr.bao.pki_ca:
    url: https://127.0.0.1:1
    token: synthetic-test-token
    mount: pki
    issuer_name: root
    type: root
    common_name: Root
  register: bao_test_pki_ca_offline
  ignore_errors: true

- name: Reject an invalid argument combination
  jomrr.bao.pki_ca:
    url: https://127.0.0.1:1
    token: synthetic-test-token
    mount: pki
    issuer_name: int
    type: intermediate
    common_name: Int
    certificate: PEM
    signing_mount: pki-root
  register: bao_test_pki_ca_invalid
  ignore_errors: true

- name: Fail on an unreachable server in check mode
  jomrr.bao.pki_ca:
    url: https://127.0.0.1:1
    token: synthetic-test-token
    mount: pki
    issuer_name: root
    type: root
    common_name: Root
  register: bao_test_pki_ca_check
  check_mode: true
  ignore_errors: true

- name: Verify validation and error handling
  ansible.builtin.assert:
    that:
      - bao_test_pki_ca_url is failed
      - "'https' in bao_test_pki_ca_url.msg"
      - bao_test_pki_ca_offline is failed
      - "'failed' in bao_test_pki_ca_offline.msg"
      - "'synthetic-test-token' not in bao_test_pki_ca_offline.msg"
      - "'synthetic-test-secret' not in bao_test_pki_ca_offline.msg"
      - bao_test_pki_ca_invalid is failed
      - "'synthetic-test-token' not in bao_test_pki_ca_invalid.msg"
      - "'synthetic-test-secret' not in bao_test_pki_ca_invalid.msg"
      - bao_test_pki_ca_check is failed
      - bao_test_pki_ca_check is not changed
    quiet: true
