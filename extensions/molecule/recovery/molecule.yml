# Generated by leg: collection Molecule configuration
---
driver:
  name: podman
scenario:
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - check
    - side_effect
    - converge
    - idempotence
    - verify
    - cleanup
    - destroy
provisioner:
  inventory:
    host_vars:
      openbao-2-6:
        ansible_connection: local
        ansible_python_interpreter: '{{ ansible_playbook_python }}'
        bao_test_version: '2.6'
        bao_test_port: 18206
      openbao-2-7:
        ansible_connection: local
        ansible_python_interpreter: '{{ ansible_playbook_python }}'
        bao_test_version: '2.7'
        bao_test_port: 18207
      openbao-recovery-2-6:
        ansible_connection: local
        ansible_python_interpreter: '{{ ansible_playbook_python }}'
        bao_test_version: '2.6'
        bao_test_port: 18216
      openbao-recovery-2-7:
        ansible_connection: local
        ansible_python_interpreter: '{{ ansible_playbook_python }}'
        bao_test_version: '2.7'
        bao_test_port: 18217
      openbao-raft-2-6:
        ansible_connection: local
        ansible_python_interpreter: '{{ ansible_playbook_python }}'
        bao_test_version: '2.6'
        bao_test_port: 18226
      openbao-raft-2-7:
        ansible_connection: local
        ansible_python_interpreter: '{{ ansible_playbook_python }}'
        bao_test_version: '2.7'
        bao_test_port: 18227
      openbao-audit-2-6:
        ansible_connection: local
        ansible_python_interpreter: '{{ ansible_playbook_python }}'
        bao_test_version: '2.6'
        bao_test_port: 18236
      openbao-audit-2-7:
        ansible_connection: local
        ansible_python_interpreter: '{{ ansible_playbook_python }}'
        bao_test_version: '2.7'
        bao_test_port: 18237
    group_vars:
      all:
        bao_test_container: '{{ inventory_hostname }}'
        bao_test_url: https://127.0.0.1:{{ bao_test_port }}
        bao_test_files: '{{ lookup(''ansible.builtin.env'', ''MOLECULE_EPHEMERAL_DIRECTORY'')
          }}/{{ inventory_hostname }}'
        bao_test_ca_file: '{{ bao_test_files }}-ca.pem'
        bao_test_root_token: molecule-root-token-not-for-production
platforms:
  - name: openbao-recovery-2-6
    image: quay.io/openbao/openbao:2.6
    pre_build_image: true
    env:
      BAO_LOCAL_CONFIG: '{"storage": {"raft": {"path": "/openbao/file", "node_id":
        "molecule"}}, "api_addr": "https://127.0.0.1:8200", "cluster_addr": "https://127.0.0.1:8201",
        "disable_mlock": true, "unsafe_allow_api_audit_creation": true, "audit": [{"file":
        {"declared": {"description": "Declared in the configuration", "options": {"file_path":
        "discard"}}}}], "listener": [{"tcp": {"address": "0.0.0.0:8200", "tls_cert_file":
        "/openbao/tls/vault-cert.pem", "tls_key_file": "/openbao/tls/vault-key.pem"}}],
        "seal": {"static": {"current_key_id": "molecule-1", "current_key": "bW9sZWN1bGUtc3RhdGljLXNlYWwta2V5LTAxMjM0NTY="}}}'
    command:
      - sh
      - -c
      - bao server -dev -dev-tls -dev-tls-cert-dir=/tmp -dev-listen-address=127.0.0.1:8300
        >/dev/null 2>&1 & until [ -s /tmp/vault-key.pem ]; do sleep 1; done; mkdir
        -p /openbao/tls; cp /tmp/vault-ca.pem /tmp/vault-cert.pem /tmp/vault-key.pem
        /openbao/tls/; killall bao; wait; exec docker-entrypoint.sh server
    published_ports:
      - 127.0.0.1:18216:8200
  - name: openbao-recovery-2-7
    image: quay.io/openbao/openbao:2.7
    pre_build_image: true
    env:
      BAO_LOCAL_CONFIG: '{"storage": {"raft": {"path": "/openbao/file", "node_id":
        "molecule"}}, "api_addr": "https://127.0.0.1:8200", "cluster_addr": "https://127.0.0.1:8201",
        "disable_mlock": true, "unsafe_allow_api_audit_creation": true, "audit": [{"file":
        {"declared": {"description": "Declared in the configuration", "options": {"file_path":
        "discard"}}}}], "listener": [{"tcp": {"address": "0.0.0.0:8200", "tls_cert_file":
        "/openbao/tls/vault-cert.pem", "tls_key_file": "/openbao/tls/vault-key.pem"}}],
        "seal": {"static": {"current_key_id": "molecule-1", "current_key": "bW9sZWN1bGUtc3RhdGljLXNlYWwta2V5LTAxMjM0NTY="}}}'
    command:
      - sh
      - -c
      - bao server -dev -dev-tls -dev-tls-cert-dir=/tmp -dev-listen-address=127.0.0.1:8300
        >/dev/null 2>&1 & until [ -s /tmp/vault-key.pem ]; do sleep 1; done; mkdir
        -p /openbao/tls; cp /tmp/vault-ca.pem /tmp/vault-cert.pem /tmp/vault-key.pem
        /openbao/tls/; killall bao; wait; exec docker-entrypoint.sh server
    published_ports:
      - 127.0.0.1:18217:8200
